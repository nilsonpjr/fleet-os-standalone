services:
  # Backend: Python/FastAPI
  - type: web
    name: fleet-os-backend
    runtime: docker
    region: oregon
    plan: free
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://fleet-os-frontend.onrender.com,http://localhost:5173

  # Frontend: Static Site
  - type: web
    name: fleet-os-frontend
    runtime: static
    buildCommand: npm run build
    staticPublishPath: dist
    rootDir: frontend
    envVars:
      - key: VITE_API_URL
        value: https://fleet-os-backend.onrender.com
